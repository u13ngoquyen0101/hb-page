<!-- ============================================================

  man2_loiKhen: [  // hiện lần lượt mỗi khi bắt được 1 trái tim
    "Được 1 rồi!",
    "Nhanh quá, còn 3 thôi",
    "Còn 2 trái tim nữa…",
    "Còn đúng 1 trái tim cuối",
    "Mở được rồi 🥳"

  man2_nutTiepTuc: "Mở lời chúc 💐",

  /* ---------- MÀN 3: ẢNH + LỜI CHÚC RIÊNG CHỊ EM HCM ----------

  man3_anh:        "images/chi-em-hcm.webp",
  man3_moTaAnh:    "Các chị em văn phòng BVBB – Chi nhánh HCM",
  man3_tieuDe:     "Gửi riêng các chị em văn phòng HCM 💐",
  man3_loiChuc: [
    "Cảm ơn vì đã luôn chu đáo, tận tâm",
    "và giữ cho văn phòng mình luôn ấm áp."
  ],
  man3_nutTiepTuc: "Còn nữa →",

  /* ---------- MÀN 4: ẢNH + LỜI CHÚC RIÊNG CHỊ EM HÀ NỘI ----------
     Hiệu ứng giống màn 3. Để man4_anh = "" thì hiện khung minh hoạ (biểu tượng + tên chi nhánh) thay cho ảnh. */
  man4_anh:        "images/chi-em-hn.webp",
  man4_bieuTuong:  "💐",
  man4_tenKhung:   "Văn phòng Hà Nội",
  man4_moTaAnh:    "Các chị em văn phòng BVBB – Chi nhánh Hà Nội",
  man4_tieuDe:     "Gửi riêng các chị em văn phòng Hà Nội 💐",
  man4_loiChuc: [
    "Cảm ơn vì luôn nhiệt huyết, tận tụy",

  ],
  man4_nutTiepTuc: "Còn nữa →",

  /* ---------- MÀN 5: ẢNH + THƯ CHÚC TOÀN THỂ CHỊ EM BVBB ----------
     Các ảnh lần lượt bay vào xếp chồng, sau đó lá thư hiện ra bên dưới.
     Ảnh xếp chồng sẽ tự đổi lượt lên trên cùng. */
  man5_anh: [
    "images/chi-em-bvbb-1.webp",
    "images/chi-em-bvbb-2.webp",
    "images/chi-em-bvbb-3.webp"
  ],
  man5_moTaAnh: "Các chị em BVBB",
  man5_tieuDeThu: "Gửi toàn thể chị em BVBB,",
  // Mỗi dòng trong mảng = 1 dòng chữ hiện ra dần. Nên để dòng ngắn cho đẹp trên điện thoại.
  man5_noiDungThu: [
    "Chúc mừng ngày Phụ nữ Việt Nam 20/10 🌸",   // dòng đầu tự động hiện to hơn
    "Cảm ơn những đóng góp thầm lặng",
    "trong từng ngày làm việc của công ty.",
    "Chúc các chị em luôn xinh đẹp, khoẻ mạnh,",
    "hạnh phúc và thành công."
  ],
  man5_kyTen: "— Anh em BVBB",
  man5_nutTiepTuc: "Còn nữa →",

  /* ---------- MÀN 6: GỬI CÁC CHỊ LÃNH ĐẠO ----------
     Ảnh chân dung tròn bật lên lần lượt theo thứ tự trong mảng. */
  man6_tieuDe: "Gửi các chị lãnh đạo BVBB 💐",
  man6_lanhDao: [
    { ten: "Chị Phương",  anh: "images/lanh-dao-phuong.webp" },   // người đầu tiên đứng riêng 1 hàng ở giữa
    { ten: "Chị Chinh",   anh: "images/lanh-dao-chinh.webp" },
    { ten: "Chị Hà",      anh: "images/lanh-dao-ha.webp" },
    { ten: "Chị Vân Anh", anh: "images/lanh-dao-van-anh.webp" }
  ],
  man6_loiChuc: [
    "Cảm ơn các chị đã luôn dẫn dắt,",
    "đồng hành và truyền cảm hứng.",
    "Chúc các chị cùng toàn thể chị em BVBB",
    "luôn rạng rỡ, hạnh phúc!"
  ],
  man6_nutTiepTuc: "Còn nữa →",

  /* ---------- MÀN 7: KẾT ---------- */
  man7_dan:     "Mà khoan… 👀",
  man7_tietLo:  "Hôm nay các chị em chỉ cần làm một việc thôi: cười thật tươi và tận hưởng một ngày thật trọn vẹn 💐",
  man7_ketThuc: "Chúc mừng 20/10! 🌷"
};
</script>

<style>
/* ===================== BIẾN & RESET ===================== */
:root{
  --pink-50:#FFF4F7;
  --pink-100:#FFE4EC;
  --pink-200:#FFC9DA;
  --pink-400:#F58BAF;
  --cream:#FFF8EE;
  --mint:#DFF3EC;
  --mint-200:#BDE8DA;
  --peach:#FFAD84;
  --peach-dark:#F58A5B;
  --ink:#6B4A55;
  --ink-soft:#9A7A85;
  --shadow-soft:0 10px 30px rgba(216,136,166,.22);
  --shadow-card:0 18px 46px rgba(200,120,150,.24);
  --r-lg:32px;
  --r-md:24px;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --ease:cubic-bezier(.22,.8,.32,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Baloo 2",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);
  background:linear-gradient(165deg,#FFF1F5 0%,#FFF8EE 45%,#E9F6F1 100%);
  overflow:hidden;
  overscroll-behavior:none;
  position:fixed;inset:0;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}

/* ===================== NỀN ĐỘNG ===================== */
#bgFloat{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.float-item{position:absolute;bottom:-60px;opacity:0;animation:floatUp linear infinite;will-change:transform,opacity}
@keyframes floatUp{
  0%{transform:translate3d(0,0,0) rotate(0deg);opacity:0}
  10%{opacity:.55}
  90%{opacity:.35}
  100%{transform:translate3d(var(--dx,20px),-115vh,0) rotate(var(--rot,40deg));opacity:0}
}

/* ===================== KHUNG MÀN HÌNH ===================== */
#stage{position:relative;z-index:1;height:100vh;height:100dvh;width:100%}
.screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 20px) 22px calc(env(safe-area-inset-bottom) + 24px);
  opacity:0;visibility:hidden;
  transform:scale(.94) translateY(14px);
  transition:opacity .5s var(--ease),transform .6s var(--spring),visibility .5s;
  text-align:center;
}
.screen.active{opacity:1;visibility:visible;transform:none}
.screen.leaving{opacity:0;transform:scale(1.06) translateY(-18px)}

/* ===================== MASCOT ===================== */
.mascot{width:112px;filter:drop-shadow(0 8px 14px rgba(214,140,166,.3));animation:bob 3.4s ease-in-out infinite}
.mascot svg{display:block;width:100%;height:auto}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}

/* ===================== MÀN 1 ===================== */
#s1 .hello{font-size:1.05rem;color:var(--ink-soft);font-weight:600;letter-spacing:.3px}
.envelope-wrap{
  margin:14px 0 6px;border:none;background:none;padding:14px;
  animation:wiggle 2.4s ease-in-out infinite;
  transform-origin:50% 85%;
}
@keyframes wiggle{
  0%,58%,100%{transform:rotate(0deg) scale(1)}
  62%{transform:rotate(-6deg) scale(1.03)}
  68%{transform:rotate(5deg) scale(1.03)}
  74%{transform:rotate(-4deg) scale(1.02)}
  80%{transform:rotate(3deg) scale(1.01)}
  86%{transform:rotate(0deg) scale(1)}
}
.envelope-wrap:active{transform:scale(.95)}
.envelope{width:min(62vw,236px);height:auto;filter:drop-shadow(0 16px 26px rgba(214,140,166,.34))}
#s1 h1{font-size:clamp(1.45rem,6.4vw,2rem);font-weight:800;line-height:1.3;margin-top:10px;text-wrap:balance}
#s1 .tap{
  margin-top:12px;font-size:1.02rem;color:var(--peach-dark);font-weight:700;
  display:inline-flex;align-items:center;gap:8px;animation:pulseTap 1.8s ease-in-out infinite
}
@keyframes pulseTap{0%,100%{transform:translateY(0);opacity:.75}50%{transform:translateY(4px);opacity:1}}
.envelope-wrap.opening{animation:openBurst .75s var(--spring) forwards}
@keyframes openBurst{
  0%{transform:scale(1) rotate(0)}
  35%{transform:scale(.88) rotate(-3deg)}
  100%{transform:scale(2.1) rotate(4deg);opacity:0}
}
.flap{transform-origin:50% 34%;transition:transform .6s var(--spring)}
.envelope-wrap.opening .flap{transform:rotateX(-172deg)}

/* ===================== MÀN 2 ===================== */
#s2{justify-content:flex-start;padding-top:calc(env(safe-area-inset-top) + 26px)}
#s2 h2{font-size:1.5rem;font-weight:800}
#s2 .guide{font-size:1rem;color:var(--ink-soft);font-weight:600;margin-top:6px;max-width:22rem;line-height:1.5}
.progress{display:flex;gap:10px;margin-top:16px;z-index:5}
.pip{width:26px;height:26px;opacity:.42;transition:opacity .3s,transform .5s var(--spring)}
.pip.on{opacity:1;transform:scale(1.22)}
/* Vùng game phải nằm TRÊN gấu/chữ, và mọi thứ phủ lên nó đều không được chặn chạm */
#gameArea{position:absolute;inset:0;z-index:4}
#s2 h2,#s2 .guide,#s2 .progress,#s2 .mascot,#s2 .praise{pointer-events:none}
.hidden-heart{
  position:absolute;width:44px;height:44px;display:grid;place-items:center;
  border:none;background:none;padding:0;
  animation:hbeat 2.6s ease-in-out infinite;
}
.hidden-heart svg{width:28px;height:28px;opacity:.62;transition:opacity .3s,transform .3s}
@keyframes hbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
#gameArea.hint .hidden-heart svg{opacity:.9;filter:drop-shadow(0 0 8px rgba(245,139,175,.85))}
.hidden-heart.caught{animation:catchPop .5s var(--spring) forwards;pointer-events:none}
@keyframes catchPop{0%{transform:scale(1)}40%{transform:scale(1.9)}100%{transform:scale(0) translateY(-26px);opacity:0}}
.praise{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:clamp(120px,22vh,180px);
  font-weight:700;color:var(--peach-dark);font-size:1.02rem;
  opacity:0;transition:opacity .35s,transform .45s var(--spring);z-index:6;
  padding:0 20px;text-wrap:balance;
}
.praise.show{opacity:1;transform:translateX(-50%) translateY(-8px)}
#s2 .mascot{width:96px;margin-top:auto;margin-bottom:14px;z-index:3}
.btn{
  font-family:inherit;font-weight:800;font-size:1.08rem;color:#fff;
  background:linear-gradient(160deg,var(--peach),var(--peach-dark));
  padding:15px 40px;border-radius:999px;min-height:54px;
  box-shadow:0 10px 22px rgba(245,138,91,.4);
  transition:transform .25s var(--spring),opacity .3s,box-shadow .25s;
  z-index:6;
}
.btn:active{transform:scale(.94)}
.btn[disabled]{opacity:.4;filter:grayscale(.5);pointer-events:none;box-shadow:none}
.btn.unlocked{animation:unlockPop .7s var(--spring)}
@keyframes unlockPop{0%{transform:scale(.7)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
#s2 .btn{margin-bottom:calc(env(safe-area-inset-bottom) + 10px)}

/* ===================== MÀN 3 — ẢNH CHỊ EM HCM ===================== */
#s3,#s4{padding-left:16px;padding-right:16px}
.photo-frame{
  width:min(100%,420px);background:#fff;padding:10px 10px 4px;border-radius:22px;
  box-shadow:var(--shadow-card);opacity:0;
}
.photo-frame img{
  display:block;width:100%;aspect-ratio:4/3;max-height:40vh;max-height:40dvh;
  object-fit:cover;border-radius:14px;
  filter:blur(10px) brightness(1.35) saturate(.6);
  transition:filter 1.6s var(--ease) .25s;
}
.photo-caption{font-family:"Patrick Hand",cursive;font-size:1.05rem;color:var(--ink-soft);padding:6px 4px 4px}
.photo-frame.show{animation:photoIn 1.1s var(--spring) forwards}
.photo-frame.show img{filter:none}
@keyframes photoIn{
  0%{opacity:0;transform:translateY(34px) scale(.82) rotate(-5deg)}
  55%{opacity:1}
  100%{opacity:1;transform:rotate(-1.5deg)}
}
/* Khung minh hoạ thay cho ảnh (màn Hà Nội) */
.photo-illus{
  position:relative;overflow:hidden;width:100%;aspect-ratio:4/3;max-height:40vh;max-height:40dvh;
  border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:radial-gradient(circle at 28% 22%,#FFF4F7 0,transparent 55%),linear-gradient(160deg,#FFD3E1,#FFF1E6 55%,#E3F4EE);
}
.photo-illus .big{font-size:clamp(3.4rem,17vw,4.6rem);line-height:1.1;animation:bob 3.4s ease-in-out infinite}
.photo-illus .place{font-family:"Patrick Hand",cursive;font-size:1.7rem;color:#E0567F}
.photo-illus .date{font-weight:700;font-size:.95rem;letter-spacing:2px;color:var(--peach-dark)}
.photo-illus .deco{position:absolute;font-size:1.25rem;opacity:.85;animation:bob 4s ease-in-out infinite}

.wish-card{
  width:min(100%,420px);margin-top:18px;
  background:linear-gradient(175deg,#FFFDF8,#FFF6EC);
  border-radius:var(--r-md);box-shadow:var(--shadow-soft);
  padding:16px 18px 10px;opacity:0;transform:translateY(26px);
}
.wish-card.show{opacity:1;transform:none;transition:opacity .6s,transform .8s var(--spring)}
.hcm-title{font-family:"Patrick Hand",cursive;font-size:1.45rem;text-wrap:balance;font-weight:400;color:var(--pink-400);line-height:1.35;margin-bottom:6px}
.wish-card .line{margin-bottom:2px}

/* ===================== MÀN 5 — THƯ CHÚC ===================== */
#s5{padding-left:16px;padding-right:16px}
/* Bọc ngoài để sticker nằm ngoài vùng cuộn của thiệp, không bị cắt góc */
.card-wrap{
  position:relative;width:100%;max-width:420px;margin-top:14px;
  opacity:0;
}
.card-wrap.show{animation:cardIn .8s var(--spring) forwards}
.card{
  position:relative;width:100%;
  background:linear-gradient(175deg,#FFFDF8,#FFF6EC);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-card);
  padding:28px 24px 24px;
  max-height:46vh;max-height:46dvh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
/* Chồng ảnh phía trên lá thư */
.photo-stack{position:relative;width:min(76%,320px);height:min(52vw,214px,26dvh);margin-bottom:8px}
.stack-photo{
  position:absolute;inset:0;margin:0;background:#fff;padding:7px;border-radius:16px;
  box-shadow:var(--shadow-card);opacity:0;
  transform:translateY(60px) scale(.7) rotate(var(--r));
  transition:opacity .5s,transform .9s var(--spring);
}
.stack-photo img{display:block;width:100%;height:100%;object-fit:cover;border-radius:11px}
.stack-photo.show{opacity:1;transform:translateX(var(--x)) rotate(var(--r))}
.stack-photo.shuffle{animation:shuffle .8s var(--ease)}
@keyframes shuffle{
  0%,100%{transform:translateX(var(--x)) rotate(var(--r))}
  50%{transform:translateX(calc(var(--x) + 78%)) rotate(14deg)}
}
@keyframes cardIn{0%{transform:translateY(40px) scale(.9) rotate(-2deg);opacity:0}100%{transform:none;opacity:1}}
.card::-webkit-scrollbar{width:0}
.sticker{position:absolute;z-index:2;font-size:1.5rem;opacity:.9;animation:bob 4s ease-in-out infinite}
.sticker.s-a{top:-14px;left:-6px;transform:rotate(-14deg)}
.sticker.s-b{top:-16px;right:2px;animation-delay:.6s}
.sticker.s-c{bottom:-12px;left:8px;animation-delay:1.2s}
.sticker.s-d{bottom:-14px;right:-4px;animation-delay:1.8s}
/* Patrick Hand chỉ có 1 độ đậm (400) — không đặt font-weight để tránh chữ bị "bôi đậm giả" */
.letter-title{
  font-family:"Patrick Hand",cursive;font-size:1.5rem;font-weight:400;
  color:var(--pink-400);margin-bottom:14px;text-align:left;
}
.letter-body{text-align:left}
.line{
  font-family:"Patrick Hand",cursive;font-size:1.24rem;line-height:1.72;color:#5C4650;
  margin-bottom:10px;opacity:0;
}
/* Dòng đầu tiên của thư = câu chúc chính, hiện to hơn */
.letter-body .line:first-child{font-size:1.9rem;color:var(--pink-400);margin-bottom:18px;line-height:1.4}
.line.write{animation:fadeLine .5s ease forwards,writeOn var(--dur,1.1s) var(--ease) forwards}
@keyframes fadeLine{to{opacity:1}}
@keyframes writeOn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 -6% 0 0)}}
.sign{
  font-family:"Patrick Hand",cursive;font-size:1.3rem;color:var(--pink-400);
  text-align:right;margin-top:12px;opacity:0;transition:opacity .8s;
}
.sign.show{opacity:1}
.after{margin-top:18px;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .6s,transform .6s var(--spring)}
.after.show{opacity:1;transform:none;pointer-events:auto}
.btn-ghost{
  font-weight:700;font-size:1rem;color:var(--peach-dark);
  background:#fff;border-radius:999px;padding:13px 28px;min-height:48px;
  box-shadow:var(--shadow-soft);
}
.btn-ghost:active{transform:scale(.94)}
#s5 .mascot{width:64px;margin-bottom:4px}
#s5 .after{margin-top:12px}

/* ===================== MÀN 6 — CÁC CHỊ LÃNH ĐẠO ===================== */
#s6{padding-left:16px;padding-right:16px}
.leaders-title{font-size:clamp(1.3rem,5.6vw,1.6rem);font-weight:800;color:#E0567F;line-height:1.3;text-wrap:balance}
.leaders{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px;width:100%;max-width:360px;margin-top:16px}
.leader:first-child{grid-column:1 / -1}
.leader{display:flex;flex-direction:column;align-items:center;opacity:0}
.leader.show{animation:leaderPop .75s var(--spring) forwards}
@keyframes leaderPop{0%{opacity:0;transform:scale(.3) translateY(24px) rotate(-8deg)}100%{opacity:1;transform:none}}
.leader .ava{
  width:min(24vw,100px);aspect-ratio:1;border-radius:50%;padding:3px;
  background:linear-gradient(150deg,var(--pink-400),var(--peach));box-shadow:var(--shadow-soft);
}
.leader img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #fff}
.leader .name{margin-top:6px;font-weight:700;font-size:1rem;line-height:1.2}
#s6 .wish-card{margin-top:16px}
#s6 .wish-card .line{margin-bottom:0}

/* ===================== MÀN 7 — KẾT ===================== */
#confetti{position:fixed;inset:0;z-index:2;pointer-events:none}
#s7{z-index:3}
#s7 .lead{font-size:1.1rem;font-weight:700;color:var(--ink-soft);opacity:0;transition:opacity .7s}
#s7 .lead.show{opacity:1}
.reveal{
  margin-top:14px;font-size:clamp(1.35rem,6.2vw,1.85rem);font-weight:800;line-height:1.42;
  color:#E0567F;max-width:20rem;text-wrap:balance;
  opacity:0;transform:scale(.6);
}
.reveal.show{animation:revealPop 1s var(--spring) forwards}
@keyframes revealPop{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
#s7 .mascot{width:150px;margin-top:22px;opacity:0;transform:translateY(24px)}
#s7 .mascot.show{opacity:1;transform:none;transition:opacity .7s,transform .9s var(--spring)}
#s7 .ending{margin-top:16px;font-size:1rem;font-weight:600;color:var(--ink-soft);opacity:0;transition:opacity .9s}
#s7 .ending.show{opacity:1}
#s7 .lead,#s7 .reveal,#s7 .ending,#s7 .mascot{position:relative;z-index:2}
.balloon{position:absolute;bottom:-140px;width:44px;z-index:0;animation:rise linear forwards;pointer-events:none}
@keyframes rise{
  0%{transform:translateY(0) rotate(-4deg);opacity:0}
  8%{opacity:.95}
  100%{transform:translateY(-125vh) rotate(6deg);opacity:.9}
}

/* ===================== RESPONSIVE / A11Y ===================== */
@media(min-width:700px){
  .envelope{width:250px}
  #s1 h1{font-size:2.1rem}
  .line{font-size:1.35rem}
  .card{padding:34px 34px 28px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.15s !important}
  .line{opacity:1}
}
</style>
</head>
<body>

<div id="bgFloat"></div>
<canvas id="confetti"></canvas>

<div id="stage">

  <!-- ============ MÀN 1 ============ -->
  <section class="screen" id="s1">
    <p class="hello" id="s1Hello"></p>
    <button class="envelope-wrap" id="envBtn" aria-label="Mở phong thư">

  <section class="screen" id="s5">

  <!-- ============ MÀN 6 ============ -->

    <h2 class="leaders-title" id="leadersTitle"></h2>

    <div class="wish-card" id="leadersWish">
      <div id="leadersLines"></div>

<script>
/* =========================================================
   TIỆN ÍCH
   ========================================================= */
const $ = s => document.querySelector(s);
const rand = (a,b) => a + Math.random()*(b-a);
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =========================================================
   MASCOT — chú gấu chibi (dùng lại ở nhiều màn)
   ========================================================= */
function bearSVG(withLetter){
  return `<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <circle cx="34" cy="34" r="16" fill="#F0CFA8"/><circle cx="34" cy="34" r="8" fill="#F9B8C8"/>
    <circle cx="94" cy="34" r="16" fill="#F0CFA8"/><circle cx="94" cy="34" r="8" fill="#F9B8C8"/>
    <ellipse cx="64" cy="98" rx="34" ry="26" fill="#F0CFA8"/>
    <ellipse cx="64" cy="102" rx="21" ry="17" fill="#FFF3E2"/>
    <circle cx="64" cy="58" r="36" fill="#F5D9B6"/>
    <ellipse cx="64" cy="70" rx="20" ry="15" fill="#FFF3E2"/>
    <ellipse cx="64" cy="64" rx="6" ry="4.4" fill="#6B4A55"/>
    <path d="M64 68 v5 M64 73 q-6 5-10 0 M64 73 q6 5 10 0" stroke="#6B4A55" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="4.4" fill="#5B4A44"/><circle cx="78" cy="50" r="4.4" fill="#5B4A44"/>
    <circle cx="51.6" cy="48.6" r="1.5" fill="#fff"/><circle cx="79.6" cy="48.6" r="1.5" fill="#fff"/>
    <ellipse cx="38" cy="62" rx="7" ry="4.6" fill="#FBB6C1" opacity=".8"/>
    <ellipse cx="90" cy="62" rx="7" ry="4.6" fill="#FBB6C1" opacity=".8"/>
    ${withLetter ? `
    <g transform="rotate(-7 64 100)">
      <rect x="42" y="86" width="44" height="30" rx="7" fill="#FFF7EC" stroke="#F4C3D2" stroke-width="2.5"/>
      <path d="M44 90 L64 104 L84 90" fill="none" stroke="#F4C3D2" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M64 108c-2.6-5.6-11-5.6-11 .6 0 5 7.4 8.6 11 11.6 3.6-3 11-6.6 11-11.6 0-6.2-8.4-6.2-11-.6z" fill="#F58BAF"/>
    </g>
    <ellipse cx="30" cy="92" rx="10" ry="8" fill="#F0CFA8" transform="rotate(-20 30 92)"/>
    <ellipse cx="98" cy="92" rx="10" ry="8" fill="#F0CFA8" transform="rotate(20 98 92)"/>` : `
    <ellipse cx="28" cy="100" rx="10" ry="8" fill="#F0CFA8" transform="rotate(-16 28 100)"/>
    <ellipse cx="100" cy="100" rx="10" ry="8" fill="#F0CFA8" transform="rotate(16 100 100)"/>`}
  </svg>`;
}
function heartSVG(color){
  return `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M12 21s-8-5-8-10.2C4 7.3 6.5 5.5 8.8 6.2 10.3 6.6 11.4 7.8 12 9c.6-1.2 1.7-2.4 3.2-2.8C17.5 5.5 20 7.3 20 10.8 20 16 12 21 12 21z" fill="${color}"/>
  </svg>`;
}

/* =========================================================
   NỀN ĐỘNG (trái tim / hoa trôi lơ lửng)
   ========================================================= */
(function bg(){
  if(reduced) return;
  const wrap = $('#bgFloat'), emojis = ['💗','🌸','💐','🌷','✨','🌸'];
  for(let i=0;i<12;i++){
    const s = document.createElement('span');
    s.className = 'float-item';
    s.textContent = emojis[i % emojis.length];
    s.style.left = rand(2,94)+'%';
    s.style.fontSize = rand(13,26)+'px';
    s.style.animationDuration = rand(17,30)+'s';
    s.style.animationDelay = -rand(0,26)+'s';
    s.style.setProperty('--dx', rand(-50,50)+'px');
    s.style.setProperty('--rot', rand(-70,70)+'deg');
    wrap.appendChild(s);
  }
})();

/* =========================================================
   ĐIỀU HƯỚNG MÀN HÌNH
   ========================================================= */
let current = null;
function goTo(id, after){
  const next = document.getElementById(id);
  if(current && current !== next){
    current.classList.add('leaving');
    current.classList.remove('active');
    const old = current;
    setTimeout(()=>old.classList.remove('leaving'), 600);
  }
  setTimeout(()=>{
    next.classList.add('active');
    current = next;
    after && after();
  }, current ? 420 : 0);
  current = current || next;
}

/* =========================================================
   MÀN 1
   ========================================================= */
$('#s1Hello').textContent = CONFIG.man1_tieuDe;
$('#s1Title').textContent = CONFIG.man1_moiGoi;
$('#s1Tap').textContent = CONFIG.man1_phuDe;

$('#envBtn').addEventListener('click', () => {
  const env = $('#envBtn');
  if(env.classList.contains('opening')) return;
  env.classList.add('opening');
  setTimeout(()=>goTo('s2', startGame), 480);
}, {passive:true});

/* =========================================================
   MÀN 2 — ĐI TÌM 5 TRÁI TIM
   ========================================================= */
const TOTAL_HEARTS = 5;
const HEART_COLORS = ['#F58BAF','#FF9EB8','#F7A9C4','#EF7FA6','#FFB3C9'];
let found = 0, hintTimer = null, rescueTimer = null;

$('#s2Title').textContent  = CONFIG.man2_tieuDe;
$('#s2Guide').textContent  = CONFIG.man2_huongDan;
$('#unlockBtn').textContent= CONFIG.man2_nutTiepTuc;
$('#mascot2').innerHTML    = bearSVG(false);

// progress pips
const progress = $('#progress');
for(let i=0;i<TOTAL_HEARTS;i++){
  const p = document.createElement('span');
  p.className = 'pip';
  p.innerHTML = heartSVG('#F1B7C8');
  progress.appendChild(p);
}

function startGame(){
  const area = $('#gameArea');
  area.innerHTML = '';
  found = 0;
  $('#unlockBtn').disabled = true;
  document.querySelectorAll('.pip').forEach(p=>p.classList.remove('on'));

  // Vị trí ngẫu nhiên trong "vùng an toàn": dưới phần tiêu đề, trên chú gấu + nút bấm.
  // Vòng lặp luôn kết thúc: nếu chỗ chật quá thì tự nới lỏng khoảng cách tối thiểu.
  const spots = [];
  let minDist = 18, guard = 0;
  while(spots.length < TOTAL_HEARTS){
    const x = rand(5, 84), y = rand(24, 62);
    if(spots.every(s => Math.hypot(s.x-x, (s.y-y)*0.9) > minDist)) spots.push({x,y});
    if(++guard % 200 === 0) minDist = Math.max(7, minDist - 3);
  }
  spots.forEach((s,i)=>{
    const b = document.createElement('button');
    b.className = 'hidden-heart';
    b.setAttribute('aria-label','Trái tim ẩn');
    b.style.left = s.x+'%';
    b.style.top  = s.y+'%';
    b.style.animationDelay = (-rand(0,2.6))+'s';
    b.innerHTML = heartSVG(HEART_COLORS[i]);
    b.addEventListener('click', ()=>catchHeart(b), {passive:true});
    area.appendChild(b);
  });

  clearTimeout(hintTimer);
  clearTimeout(rescueTimer);
  area.classList.remove('hint');

  // Sau 9s: các trái tim còn lại sáng lên
  hintTimer = setTimeout(()=>{
    if(found < TOTAL_HEARTS){
      area.classList.add('hint');
      showPraise(CONFIG.man2_goiY);
    }
  }, 9000);

  // Sau 20s: "giải cứu" — trái tim còn lại tự chạy ra giữa màn hình cho dễ thấy,
  // đảm bảo không bao giờ bị kẹt không tìm được.
  rescueTimer = setTimeout(()=>{
    const left = [...area.querySelectorAll('.hidden-heart:not(.caught)')];
    if(!left.length) return;
    left.forEach((el,i)=>{
      el.style.transition = 'left .9s var(--spring), top .9s var(--spring)';
      el.style.left = (16 + i*16) + '%';
      el.style.top  = (36 + (i%2)*11) + '%';
    });
    showPraise(CONFIG.man2_giaiCuu);
  }, 20000);
}

let praiseTimer = null;
function showPraise(text){
  const p = $('#praise');
  p.textContent = text;
  p.classList.add('show');
  clearTimeout(praiseTimer);
  praiseTimer = setTimeout(()=>p.classList.remove('show'), 2600);
}

function catchHeart(el){
  if(el.classList.contains('caught')) return;
  el.classList.add('caught');
  document.querySelectorAll('.pip')[found].classList.add('on');
  found++;
  showPraise(CONFIG.man2_loiKhen[found-1] || '');
  if(found === TOTAL_HEARTS){
    clearTimeout(hintTimer);
    clearTimeout(rescueTimer);
    const btn = $('#unlockBtn');
    btn.disabled = false;
    btn.classList.add('unlocked');
  }
}

$('#unlockBtn').addEventListener('click', ()=>goTo('s3', playHcm), {passive:true});

/* Viết lần lượt từng dòng vào container, trả về thời điểm (ms) dòng cuối viết xong */
function writeLines(container, texts, scrollEl){
  container.innerHTML = '';
  const nodes = texts.map(t=>{
    const p = document.createElement('p');
    p.className = 'line';
    p.textContent = t;
    container.appendChild(p);
    return p;
  });
  let t = 400;
  nodes.forEach(n=>{
    const dur = Math.min(2.2, Math.max(.8, n.textContent.length*0.032));
    setTimeout(()=>{
      n.style.setProperty('--dur', dur+'s');
      n.classList.add('write');
      scrollEl && scrollEl.scrollTo({top:scrollEl.scrollHeight, behavior:'smooth'});
    }, t);
    t += dur*1000*0.72 + 260;
  });
  return t;
}

/* =========================================================
   MÀN 3 — ẢNH + LỜI CHÚC RIÊNG CHỊ EM HCM
   ========================================================= */
const hcmPhoto = $('#hcmPhoto');
hcmPhoto.src = CONFIG.man3_anh;
hcmPhoto.alt = CONFIG.man3_moTaAnh;
$('#hcmCaption').textContent = CONFIG.man3_moTaAnh;
$('#hcmTitle').textContent   = CONFIG.man3_tieuDe;
$('#hcmNext').textContent    = CONFIG.man3_nutTiepTuc;

/* Dùng chung cho màn 3 & 4: khung ảnh hiện trước, lời chúc hiện sau */
function playPhotoWish(o){
  const start = ()=>{
    // 1) Ảnh hiện ra trước (bay lên + rõ dần) kèm một ít confetti
    o.frame.classList.add('show');
    if(!reduced) setTimeout(()=>burst(60,.3), 450);
    // 2) Sau đó lời chúc trượt lên và hiện dần từng dòng
    setTimeout(()=>{
      o.wish.classList.add('show');
      const t = writeLines(o.lines, o.texts);
      setTimeout(()=>o.after.classList.add('show'), t + 400);
    }, 2000);
  };
  // Đợi ảnh tải xong rồi mới chạy hiệu ứng (lỗi ảnh thì vẫn chạy tiếp)
  if(!o.img || o.img.complete) start();
  else { o.img.onload = start; o.img.onerror = start; }
}

let hcmPlayed = false;
function playHcm(){
  if(hcmPlayed) return;
  hcmPlayed = true;
  playPhotoWish({frame:$('#photoFrame'), img:hcmPhoto, wish:$('#hcmWish'),
                 lines:$('#hcmLines'), texts:CONFIG.man3_loiChuc, after:$('#s3After')});
}

$('#hcmNext').addEventListener('click', ()=>goTo('s4', playHn), {passive:true});

/* =========================================================
   MÀN 4 — LỜI CHÚC RIÊNG CHỊ EM HÀ NỘI
   ========================================================= */
let hnPhoto = null;
if(CONFIG.man4_anh){
  // Có ảnh thì thay khung minh hoạ bằng ảnh thật
  hnPhoto = document.createElement('img');
  hnPhoto.decoding = 'async';
  hnPhoto.src = CONFIG.man4_anh;
  hnPhoto.alt = CONFIG.man4_moTaAnh;
  $('#hnIllus').replaceWith(hnPhoto);
} else {
  $('#hnIcon').textContent  = CONFIG.man4_bieuTuong;
  $('#hnPlace').textContent = CONFIG.man4_tenKhung;
}
$('#hnCaption').textContent = CONFIG.man4_moTaAnh;
$('#hnTitle').textContent   = CONFIG.man4_tieuDe;
$('#hnNext').textContent    = CONFIG.man4_nutTiepTuc;

let hnPlayed = false;
function playHn(){
  if(hnPlayed) return;
  hnPlayed = true;
  playPhotoWish({frame:$('#hnFrame'), img:hnPhoto, wish:$('#hnWish'),
                 lines:$('#hnLines'), texts:CONFIG.man4_loiChuc, after:$('#s4After')});
}

$('#hnNext').addEventListener('click', ()=>goTo('s5', playLetter), {passive:true});

/* =========================================================
   MÀN 5 — THƯ CHÚC
   ========================================================= */
$('#letterTitle').textContent = CONFIG.man5_tieuDeThu;
$('#sign').textContent        = CONFIG.man5_kyTen;
$('#nextBtn').textContent     = CONFIG.man5_nutTiepTuc;
$('#mascot3').innerHTML       = bearSVG(false);

// Dựng chồng ảnh: mỗi ảnh nghiêng một chút, ảnh cuối nằm trên cùng
const STACK_POSE = [['-8deg','-10px'],['6deg','10px'],['-1.5deg','0px']];
const stackPhotos = CONFIG.man5_anh.map((src,i)=>{
  const f = document.createElement('figure');
  f.className = 'stack-photo';
  const [r,x] = STACK_POSE[i % STACK_POSE.length];
  f.style.setProperty('--r', r);
  f.style.setProperty('--x', x);
  f.innerHTML = `<img src="${src}" alt="${CONFIG.man5_moTaAnh}" decoding="async">`;
  $('#photoStack').appendChild(f);
  return f;
});

// Đổi lượt: ảnh trên cùng trượt sang bên rồi chui xuống dưới cùng (phần tử cuối của stackOrder = trên cùng)
const stackOrder = stackPhotos.slice();
const applyStackZ = ()=>stackOrder.forEach((f,i)=>f.style.zIndex = i+1);
applyStackZ();
function shuffleStack(){
  if(stackOrder.length < 2) return;
  const top = stackOrder[stackOrder.length-1];
  top.classList.add('shuffle');
  setTimeout(()=>{ stackOrder.unshift(stackOrder.pop()); applyStackZ(); }, 400);
  setTimeout(()=>top.classList.remove('shuffle'), 820);
}

let letterPlayed = false;
function playLetter(){
  if(letterPlayed) return;
  letterPlayed = true;

  // 1) Các ảnh lần lượt bay vào
  stackPhotos.forEach((f,i)=>setTimeout(()=>f.classList.add('show'), 200 + i*650));
  const photosDone = 200 + stackPhotos.length*650 + 500;
  if(!reduced) setTimeout(()=>setInterval(shuffleStack, 3200), photosDone + 2500);

  // 2) Sau đó lá thư hiện ra và viết dần từng dòng
  setTimeout(()=>{
    $('#cardWrap').classList.add('show');
    const card = $('#card');
    const t = writeLines($('#letterBody'), CONFIG.man5_noiDungThu, card) + 400;
    setTimeout(()=>{
      $('#sign').classList.add('show');
      card.scrollTo({top:card.scrollHeight, behavior:'smooth'});
    }, t + 150);
    setTimeout(()=>$('#s5After').classList.add('show'), t + 700);
  }, photosDone);
}

$('#nextBtn').addEventListener('click', ()=>goTo('s6', playLeaders), {passive:true});

/* =========================================================
   MÀN 6 — CÁC CHỊ LÃNH ĐẠO
   ========================================================= */
$('#leadersTitle').textContent = CONFIG.man6_tieuDe;
$('#leadersNext').textContent  = CONFIG.man6_nutTiepTuc;

const leaderEls = CONFIG.man6_lanhDao.map(p=>{
  const d = document.createElement('div');
  d.className = 'leader';
  d.innerHTML = `<div class="ava"><img decoding="async"></div><p class="name"></p>`;
  const img = d.querySelector('img');
  img.src = p.anh;
  img.alt = p.ten;
  d.querySelector('.name').textContent = p.ten;
  $('#leaders').appendChild(d);
  return d;
});

let leadersPlayed = false;
function playLeaders(){
  if(leadersPlayed) return;
  leadersPlayed = true;
  // 1) Từng ảnh chân dung bật lên
  leaderEls.forEach((el,i)=>setTimeout(()=>el.classList.add('show'), 300 + i*320));
  const done = 300 + leaderEls.length*320 + 500;
  if(!reduced) setTimeout(()=>burst(50,.35), done - 300);
  // 2) Sau đó lời tri ân hiện dần
  setTimeout(()=>{
    $('#leadersWish').classList.add('show');
    const t = writeLines($('#leadersLines'), CONFIG.man6_loiChuc);
    setTimeout(()=>$('#s6After').classList.add('show'), t + 400);
  }, done);
}

$('#leadersNext').addEventListener('click', ()=>goTo('s7', playFinale), {passive:true});

/* =========================================================
   MÀN 7 — CONFETTI + BÓNG BAY + LỜI KẾT
   ========================================================= */
$('#s7Lead').textContent   = CONFIG.man7_dan;
$('#s7Reveal').textContent = CONFIG.man7_tietLo;
$('#s7End').textContent    = CONFIG.man7_ketThuc;
$('#mascot4').innerHTML    = bearSVG(true);

/* --- confetti tự vẽ bằng canvas, không cần thư viện ngoài --- */
const cv = $('#confetti'), ctx = cv.getContext('2d');
let parts = [], raf = null;
function sizeCanvas(){
  const d = Math.min(window.devicePixelRatio||1, 2);
  cv.width = innerWidth*d; cv.height = innerHeight*d;
  ctx.setTransform(d,0,0,d,0,0);
}
sizeCanvas();
addEventListener('resize', sizeCanvas);

const CONFETTI_COLORS = ['#F58BAF','#FFAD84','#BDE8DA','#FFD9E4','#FFE1A8','#C9B6F0'];
function burst(n, originY){
  for(let i=0;i<n;i++){
    parts.push({
      x: innerWidth/2 + rand(-70,70),
      y: innerHeight*originY,
      vx: rand(-7.5,7.5),
      vy: rand(-16,-6),
      g: rand(.24,.36),
      w: rand(6,11), h: rand(8,15),
      rot: rand(0,Math.PI*2), vr: rand(-.22,.22),
      c: CONFETTI_COLORS[(Math.random()*CONFETTI_COLORS.length)|0],
      life: rand(90,175), age:0,
      round: Math.random()<.35
    });
  }
  if(!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p=>{
    p.age++; p.vy += p.g; p.vx *= .992;
    p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    const alpha = Math.max(0, 1 - p.age/p.life);
    if(alpha<=0 || p.y > innerHeight+60) return false;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.c;
    if(p.round){ ctx.beginPath(); ctx.ellipse(0,0,p.w/2,p.h/2,0,0,Math.PI*2); ctx.fill(); }
    else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    ctx.restore();
    return true;
  });
  if(parts.length) raf = requestAnimationFrame(tick);
  else { raf = null; ctx.clearRect(0,0,innerWidth,innerHeight); }
}

function balloon(delay){
  const colors = ['#F58BAF','#FFAD84','#BDE8DA','#FFC9DA','#C9B6F0'];
  const c = colors[(Math.random()*colors.length)|0];
  const el = document.createElement('div');
  el.className = 'balloon';
  el.style.left = rand(4,88)+'%';
  el.style.animationDuration = rand(7,12)+'s';
  el.style.animationDelay = delay+'s';
  el.innerHTML = `<svg viewBox="0 0 44 70" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="22" cy="24" rx="19" ry="23" fill="${c}"/>
      <ellipse cx="15" cy="16" rx="5" ry="7" fill="#fff" opacity=".38"/>
      <path d="M22 47 l-4 5 h8 z" fill="${c}"/>
      <path d="M22 52 q7 9 0 17" stroke="${c}" stroke-width="1.6" fill="none" opacity=".7"/>
    </svg>`;
  $('#s7').appendChild(el);
  setTimeout(()=>el.remove(), (12+delay)*1000);
}

let finalePlayed = false;
function playFinale(){
  if(finalePlayed) return;
  finalePlayed = true;

  setTimeout(()=>$('#s7Lead').classList.add('show'), 250);
  setTimeout(()=>{
    $('#s7Reveal').classList.add('show');
    if(!reduced){
      burst(90,.55);
      setTimeout(()=>burst(60,.42), 380);
      setTimeout(()=>burst(50,.6), 820);
      for(let i=0;i<9;i++) balloon(i*0.55);
    }
  }, 1250);
  setTimeout(()=>$('#mascot4').classList.add('show'), 2200);
  setTimeout(()=>$('#s7End').classList.add('show'), 2900);
  if(!reduced){
    setTimeout(()=>{ burst(45,.5); for(let i=0;i<5;i++) balloon(i*0.8); }, 6500);
  }
}

/* =========================================================
   KHỞI ĐỘNG
   ========================================================= */
goTo('s1');
